ur3_rl_policy_node:
  ros__parameters:
    model_path: "models/policy.onnx"
    control_frequency_hz: 30.0
    action_scale: 0.05
    safety_max_joint_delta: 0.05
    enable_execution: false
    command_topic: "/forward_position_controller/commands"
    joint_states_topic: "/joint_states"
    target_pose_topic: "/ur3_reach/target_pose"
    box_marker_topic: "/ur3_reach/workspace_box_marker"
    workspace_bounds:
      radius_min: 0.10
      radius_max: 0.48
      x_min: -0.15
      x_max: 0.60
      y_min: -0.60
      y_max: 0.60
      z_min: 0.05
      z_max: 0.70

interactive_target_publisher:
  ros__parameters:
    frame_id: "base_link"
    ee_frame_id: "tool0"
    target_pose_topic: "/ur3_reach/target_pose"
    bounds_marker_topic: "/ur3_reach/workspace_bounds_marker"
    box_marker_topic: "/ur3_reach/workspace_box_marker"
    continuous_publishing: true
    publish_frequency_hz: 30.0
    initial_pose:
      x: 0.35
      y: 0.00
      z: 0.22
    workspace_bounds:
      radius_min: 0.10
      radius_max: 0.48
      x_min: -0.15
      x_max: 0.60
      y_min: -0.60
      y_max: 0.60
      z_min: 0.05
      z_max: 0.70
