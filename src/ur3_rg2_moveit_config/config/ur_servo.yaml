###############################################
# MoveIt Servo parameters for UR3 + OnRobot RG2
###############################################
use_gazebo: false
status_topic: ~/status

## Properties of incoming commands
command_in_type: "speed_units"
scale:
  linear: 0.4
  rotational: 0.8
  joint: 0.5

low_pass_filter_coeff: 2.0

## Properties of outgoing commands
publish_period: 0.002
publish_joint_positions: false
publish_joint_velocities: true
publish_joint_accelerations: false

command_out_topic: /forward_velocity_controller/commands

## Collision checking
check_collisions: true
collision_check_rate: 10.0
collision_distance_safety_factor: 1.05
min_allowable_collision_distance: 0.01

## Joint / Cartesian limits
joint_limit_margin: 0.1

incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

## Kinematics
planning_frame: base_link
ee_frame_name: rg2_gripper_tcp
robot_link_command_frame: tool0
